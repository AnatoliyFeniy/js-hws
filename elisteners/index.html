<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <div class="wrap" id="wrap">
        <h1>title</h1>
        <button id="btn1">change to dark mode</button>
        <div class="calculator" id="calculator">
            <p id="pole"></p>
            <div class="buttons">
                <div class="numbers">
                    <div>
                        <button class="btnn" id="1">1</button>
                        <button class="btnn" id="2">2</button>
                        <button class="btnn" id="3">3</button>
                    </div>
                    <div>
                        <button class="btnn" id="4">4</button>
                        <button class="btnn" id="5">5</button>
                        <button class="btnn" id="6">6</button>
                    </div>
                    <div>
                        <button class="btnn" id="7">7</button>
                        <button class="btnn" id="8">8</button>
                        <button class="btnn" id="9">9</button>
                    </div>
                    <button class="btnn0" id="0">0</button>
                </div>
                <div class="pme">
                    <button class="btnn" id="+">+</button>
                    <button class="btnn" id="-">-</button>
                    <button class="btnn" id="=">=</button>
                </div>
            </div>
        </div>
        <div class="form">
        <input type="text" id="input">
        <button id="btn2">submit</button>
        </div>
        <button id="btn3">count</button>
        <p id="txt">0</p>
    </div>




    <script src="./js/scipt.js"></script>
</body>

</html>
